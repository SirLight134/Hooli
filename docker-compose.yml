services:
    frontend:
        build:
            context: .
            dockerfile: apps/Frontend/Dockerfile
        ports:
            - "5173:80"
        depends_on:
            - backend
        restart: unless-stopped

    backend:
        build:
            context: .
            dockerfile: apps/Backend/Dockerfile
        ports:
            - "3000:3000"
        env_file: .env
        restart: unless-stopped